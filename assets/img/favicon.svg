<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="2.5" />

  <!-- Stylized Monogram "G" with Code Angle -->
  <g filter="url(#subtleGlow)">
    <!-- Main "G" contour -->
    <path
      d="M44 23.5 C41 18.5 35.5 16 29.5 16 C19.5 16 13 23 13 32 C13 41 19.5 48 29.5 48 C38 48 43.5 43.5 44.5 35.5 L29 35.5 L29 29.5 L50.5 29.5 C51 31.5 51 33.5 51 35.5 C51 46.5 42 54 29.5 54 C16 54 7 44 7 32 C7 20 16 10 29.5 10 C38 10 45 13.8 49 19.5 Z"
      fill="url(#primaryGrad)"
    />
    <!-- Accent Terminal Dot / Pulse -->
    <circle cx="43" cy="22" r="3" fill="#38bdf8" />
  </g>
</svg>
